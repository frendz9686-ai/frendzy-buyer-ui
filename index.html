<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frendzy - Buyer Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { farmgreen: '#16a34a', farmyellow: '#f59e0b' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl relative pb-20 overflow-hidden flex flex-col justify-between">
        
        <!-- Header -->
        <header class="bg-white p-4 rounded-b-3xl shadow-sm border-b sticky top-0 z-40 flex justify-between items-center">
            <div>
                <h2 class="font-extrabold text-xl text-gray-900"><span class="text-farmgreen">Frendzy</span> Market</h2>
                <p class="text-gray-500 text-[10px] mt-0.5">B2B Wholesale & B2C Retail Marketplace</p>
            </div>
            <div class="flex items-center gap-2">
                <select id="langSwitcher" onchange="changeLanguage(this.value)" class="bg-gray-100 border rounded-lg px-2 py-1 text-xs font-bold outline-none cursor-pointer">
                    <option value="en">EN</option>
                    <option value="hi">HI</option>
                    <option value="kn">KN</option>
                </select>
                <button onclick="clearSession()" id="logoutBtn" class="hidden text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded-full hover:bg-red-200 transition font-bold">Logout</button>
            </div>
        </header>

        <!-- AUTH VIEW (Buyer Login & Registration with PIN & OTP) -->
        <div id="authView" class="p-5 my-auto block">
            <div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-100">
                <div class="flex bg-gray-100 rounded-2xl p-1 mb-5">
                    <button onclick="switchAuthTab('login')" id="tabLogin" class="flex-1 py-2.5 text-xs font-bold bg-white text-farmgreen rounded-xl shadow-sm transition">Buyer Login</button>
                    <button onclick="switchAuthTab('setup')" id="tabSetup" class="flex-1 py-2.5 text-xs font-bold text-gray-500 rounded-xl transition">Register</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-4 block" onsubmit="handleLogin(event)">
                    <input type="tel" id="loginPhone" required placeholder="10-Digit Phone Number" class="w-full border rounded-2xl p-3.5 text-sm focus:ring-2 focus:ring-farmgreen outline-none bg-gray-50">
                    <input type="password" id="loginPin" required placeholder="Your PIN / Password" class="w-full border rounded-2xl p-3.5 text-sm focus:ring-2 focus:ring-farmgreen outline-none bg-gray-50">
                    <button type="submit" class="w-full bg-farmgreen text-white font-bold py-3.5 rounded-2xl shadow-md transition hover:bg-green-700">Login to Marketplace</button>
                    <p id="loginStatus" class="text-xs text-red-500 font-bold text-center mt-2 hidden">Invalid credentials or account not found.</p>
                </form>

                <!-- Registration Form with OTP -->
                <form id="setupForm" class="space-y-3 hidden" onsubmit="handleRegister(event)">
                    <input type="text" id="setupName" required placeholder="Full Name / Business Name" class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-farmgreen outline-none bg-gray-50">
                    <input type="tel" id="setupPhone" required placeholder="10-Digit Phone Number" class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-farmgreen outline-none bg-gray-50">
                    <input type="password" id="setupPin" required placeholder="Create PIN / Password" class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-farmgreen outline-none bg-gray-50">
                    
                    <div id="otpSection" class="hidden space-y-2 pt-1">
                        <input type="text" id="setupOtpInput" placeholder="Enter Mock OTP (1234)" class="w-full border rounded-xl p-3 text-sm text-center tracking-widest font-bold focus:ring-2 focus:ring-farmgreen outline-none bg-gray-50">
                    </div>

                    <button type="button" id="getOtpBtn" onclick="triggerMockOtp()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-2xl shadow-md transition hover:bg-blue-700 mt-2">Send Verification OTP</button>
                    <button type="submit" id="registerSubmitBtn" class="w-full bg-farmgreen text-white font-bold py-3.5 rounded-2xl shadow-md transition hover:bg-green-700 mt-2 hidden">Complete Registration</button>
                    
                    <p id="setupStatus" class="text-xs text-red-500 font-bold text-center mt-2 hidden">Registration failed.</p>
                </form>
            </div>
        </div>

        <!-- MARKETPLACE FEED VIEW (Hidden until login) -->
        <div id="marketView" class="p-4 space-y-4 hidden">
            <div class="flex justify-between items-center bg-white p-3.5 rounded-2xl shadow-sm border">
                <div>
                    <h3 class="font-extrabold text-xs text-gray-900 uppercase">Fresh Harvests Near You</h3>
                    <p class="text-[10px] text-gray-400">Directly from verified farmers</p>
                </div>
                <button onclick="openLogisticsModal()" class="bg-blue-600 text-white text-[10px] font-bold px-3 py-2 rounded-xl shadow-sm hover:bg-blue-700 transition"><i class="fas fa-truck mr-1"></i> Request Logistics</button>
            </div>

            <div id="marketFeed" class="space-y-4">
                <p class="text-center text-gray-400 italic py-8">Loading crops...</p>
            </div>
        </div>

        <!-- Order Action Modal -->
        <div id="actionModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex-col justify-end">
            <div class="bg-white rounded-t-3xl p-6 shadow-2xl transition-all max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-extrabold text-lg text-gray-900" id="modalTitle">Connect with Farmer</h3>
                    <button onclick="closeModal()" class="text-gray-400 bg-gray-100 rounded-full h-8 w-8 flex justify-center items-center"><i class="fas fa-times"></i></button>
                </div>
                
                <div id="menuOptions" class="space-y-3 mt-4 block">
                    <button onclick="openWhatsApp()" class="w-full bg-[#25D366] text-white py-3.5 px-4 rounded-2xl flex items-center shadow-md">
                        <i class="fab fa-whatsapp text-2xl mr-3 w-6"></i>
                        <div class="text-left"><span class="block text-sm font-bold">WhatsApp Quick Chat</span></div>
                    </button>
                    <button onclick="showOrderForm()" class="w-full bg-gray-900 text-white py-3.5 px-4 rounded-2xl flex items-center shadow-md">
                        <i class="fas fa-file-invoice text-2xl mr-3 w-6"></i>
                        <div class="text-left"><span class="block text-sm font-bold">Submit Formal Order (B2B / B2C)</span></div>
                    </button>
                </div>

                <div id="orderForm" class="hidden mt-4 space-y-3.5">
                    <div class="bg-gray-50 p-3.5 rounded-2xl border flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-gray-700" id="orderCropName"></span>
                        <span class="text-xs font-extrabold text-farmgreen" id="orderCropPrice"></span>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-700 mb-1">Market Segment (B2B vs B2C)</label>
                        <select id="orderType" onchange="calculateTotal()" class="w-full border rounded-xl p-3 text-sm bg-gray-50 outline-none">
                            <option value="B2C">B2C - Retail (Cash on Delivery, 0% Advance)</option>
                            <option value="B2B">B2B - Wholesale Bulk (25% Advance Required)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-700 mb-1">Quantity (kg)</label>
                            <input type="number" id="orderQty" onkeyup="calculateTotal()" placeholder="e.g., 50" class="w-full border rounded-xl p-3 text-sm bg-gray-50 outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-700 mb-1">Your Phone</label>
                            <input type="tel" id="orderPhone" placeholder="10-digit" class="w-full border rounded-xl p-3 text-sm bg-gray-50 outline-none">
                        </div>
                    </div>
                    <div class="bg-blue-50 p-3.5 rounded-2xl border border-blue-100 space-y-1">
                        <div class="flex justify-between text-xs"><span class="text-gray-600">Total Invoice:</span><span id="calcTotal" class="font-bold">₹0</span></div>
                        <div class="flex justify-between text-xs"><span class="text-blue-800 font-bold">Advance to Pay Now:</span><span id="calcAdvance" class="font-extrabold text-base text-blue-900">₹0</span></div>
                    </div>
                    <button onclick="submitOrderToDB()" id="confirmBtn" class="w-full bg-farmgreen text-white font-bold py-3.5 rounded-2xl shadow-md">Process Secure Order</button>
                    <p id="orderStatus" class="text-center font-bold text-xs hidden mt-2"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Config & Logic -->
    <script src="./config.js"></script>
    <script>
        let currentCropName = "", currentCropPrice = 0, currentFarmerPhone = "";
        let currentUser = JSON.parse(localStorage.getItem('frendzy_buyer') || 'null');
        let generatedMockOtp = "";

        if (!currentUser) {
            document.getElementById('authView').classList.remove('hidden');
        } else {
            activateMarketplace();
        }

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('tabLogin').className = "flex-1 py-2.5 text-xs font-bold bg-white text-farmgreen rounded-xl shadow-sm transition";
                document.getElementById('tabSetup').className = "flex-1 py-2.5 text-xs font-bold text-gray-500 rounded-xl transition";
                document.getElementById('loginForm').classList.replace('hidden', 'block');
                document.getElementById('setupForm').classList.replace('block', 'hidden');
            } else {
                document.getElementById('tabSetup').className = "flex-1 py-2.5 text-xs font-bold bg-white text-farmgreen rounded-xl transition";
                document.getElementById('tabLogin').className = "flex-1 py-2.5 text-xs font-bold text-gray-500 rounded-xl transition";
                document.getElementById('setupForm').classList.replace('hidden', 'block');
                document.getElementById('loginForm').classList.replace('block', 'hidden');
            }
        }

        function triggerMockOtp() {
            const phone = document.getElementById('setupPhone').value;
            if(!phone || phone.length < 10) {
                alert("Please enter a valid 10-digit phone number first.");
                return;
            }
            generatedMockOtp = "1234";
            alert("📱 Mock OTP Sent! Use [ 1234 ] to verify.");
            document.getElementById('otpSection').classList.remove('hidden');
            document.getElementById('getOtpBtn').classList.add('hidden');
            document.getElementById('registerSubmitBtn').classList.remove('hidden');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const otp = document.getElementById('setupOtpInput').value;
            if (otp !== generatedMockOtp) {
                alert("❌ Invalid OTP. Use 1234.");
                return;
            }

            const payload = {
                name: document.getElementById('setupName').value,
                phone: document.getElementById('setupPhone').value,
                password: document.getElementById('setupPin').value,
                role: 'BUYER'
            };

            try {
                const res = await fetch(`${API_BASE_URL}/api/signup`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    alert("✅ Buyer registration successful! Please log in.");
                    switchAuthTab('login');
                } else {
                    const err = await res.json();
                    alert(`Registration failed: ${err.error || 'Unknown error'}`);
                }
            } catch(e) {
                alert("Network error.");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPin').value;

            try {
                const res = await fetch(`${API_BASE_URL}/api/login`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ phone, password })
                });
                if(res.ok) {
                    const data = await res.json();
                    if(data.user.role !== 'BUYER') {
                        alert("This account is registered as a Farmer, not a Buyer.");
                        return;
                    }
                    localStorage.setItem('frendzy_buyer', JSON.stringify(data.user));
                    window.location.reload();
                } else {
                    document.getElementById('loginStatus').classList.remove('hidden');
                }
            } catch(e) {
                alert("Login connection failed.");
            }
        }

        function clearSession() {
            localStorage.removeItem('frendzy_buyer');
            window.location.reload();
        }

        function activateMarketplace() {
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('marketView').classList.remove('hidden');
            document.getElementById('orderPhone').value = currentUser.phone || '';
            loadMarketplace();
        }
        
        async function loadMarketplace() {
            const feed = document.getElementById('marketFeed');
            try {
                const response = await fetch(`${API_BASE_URL}/api/crops/feed`);
                const json = await response.json();
                feed.innerHTML = ''; 
                if(!json.data || json.data.length === 0) {
                    feed.innerHTML = `<p class="text-center text-gray-400 italic py-8">No harvests available right now.</p>`;
                    return;
                }
                json.data.reverse().forEach(crop => {
                    feed.innerHTML += `
                        <div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
                            <div class="h-44 w-full relative"><img src="${crop.image_url || 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?w=600&q=80'}" class="w-full h-full object-cover"></div>
                            <div class="p-4 space-y-2">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-base text-gray-900">${crop.product_details?.crop_name || 'Harvest'}</h3>
                                    <span class="bg-green-50 text-farmgreen text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase">${crop.product_details?.category || 'Produce'}</span>
                                </div>
                                <p class="font-extrabold text-xl text-gray-900">₹${crop.pricing?.market_price_per_kg || 0} <span class="text-xs font-normal text-gray-400">per kg</span></p>
                                <button onclick="openMenu('${crop.product_details?.crop_name}', ${crop.pricing?.market_price_per_kg || 0}, '${crop.farmer_phone}')" class="w-full bg-gray-900 text-white font-bold py-3 rounded-2xl text-xs shadow-sm hover:bg-black transition">Pre-Book Harvest</button>
                            </div>
                        </div>`;
                });
            } catch (err) { feed.innerHTML = '<p class="text-center text-red-500 font-bold">Error loading marketplace.</p>'; }
        }

        function openMenu(name, price, phone) {
            currentCropName = name; currentCropPrice = price; currentFarmerPhone = phone || '9999999999';
            document.getElementById('menuOptions').classList.remove('hidden');
            document.getElementById('orderForm').classList.add('hidden');
            document.getElementById('actionModal').classList.remove('hidden'); 
            document.getElementById('actionModal').classList.add('flex');
        }

        function closeModal() { document.getElementById('actionModal').classList.add('hidden'); document.getElementById('actionModal').classList.remove('flex'); }

        function showOrderForm() { 
            document.getElementById('menuOptions').classList.add('hidden'); 
            document.getElementById('orderForm').classList.remove('hidden');
            document.getElementById('orderCropName').innerText = currentCropName;
            document.getElementById('orderCropPrice').innerText = `₹${currentCropPrice}/kg`;
            calculateTotal();
        }

        function calculateTotal() {
            const qty = Number(document.getElementById('orderQty').value) || 0;
            const type = document.getElementById('orderType').value;
            const total = qty * currentCropPrice;
            document.getElementById('calcTotal').innerText = `₹${total}`;
            document.getElementById('calcAdvance').innerText = `₹${type === 'B2B' ? Math.round(total * 0.25) : 0}`;
        }

        async function submitOrderToDB() {
            const qty = Number(document.getElementById('orderQty').value);
            if(!qty || qty <= 0) {
                alert("Please enter a valid quantity.");
                return;
            }
            const type = document.getElementById('orderType').value;
            const total = qty * currentCropPrice;
            const advance = type === 'B2B' ? Math.round(total * 0.25) : 0;

            const payload = { 
                crop_name: currentCropName, 
                price_per_kg: currentCropPrice, 
                quantity_kg: qty, 
                buyer_phone: document.getElementById('orderPhone').value, 
                farmer_phone: currentFarmerPhone, 
                order_type: type,
                total_price: total,
                advance_paid: advance,
                status: 'Pending'
            };

            try {
                const res = await fetch(`${API_BASE_URL}/api/orders`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    alert(`✅ Order submitted successfully! (${type} Segment)`);
                    closeModal();
                } else {
                    alert("❌ Failed to submit order.");
                }
            } catch(e) {
                alert("❌ Network error.");
            }
        }

        function openWhatsApp() {
            window.open(`https://wa.me/${currentFarmerPhone}?text=Hello, I am interested in buying your harvest: ${currentCropName}`, '_blank');
        }
    </script>
</body>
</html>
